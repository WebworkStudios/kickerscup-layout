<!-- TRAINING PAGE -->
<div class="content-area">
    <div class="training-container">
        <!-- Training Header -->
        <div class="training-header">
            <h1 class="training-header-title">💪 Trainingstag Planer</h1>
            <p class="training-header-subtitle">Stelle deinen perfekten Trainingstag zusammen</p>
        </div>

        <!-- Main Training Layout -->
        <div class="training-main-layout">
            <!-- Training Cards Library -->
            <div class="training-library">
                <h2 class="section-title">
                    <span>📚</span>
                    <span>Verfügbare Trainingseinheiten</span>
                </h2>
                <div class="training-cards-grid" id="trainingCards">
                    <!-- Training cards will be rendered here -->
                </div>
            </div>

            <!-- Timeline -->
            <div class="training-timeline">
                <h2 class="section-title">
                    <span>⏰</span>
                    <span>Tagesplan</span>
                </h2>
                <div class="timeline-slots" id="timelineSlots">
                    <!-- Timeline slots will be rendered here -->
                </div>
                <div class="timeline-actions">
                    <button class="save-btn" id="saveBtn" disabled>
                        💾 Trainingstag Speichern
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Effect Overlay -->
<div class="effect-overlay" id="effectOverlay">
    <div class="effect-content">
        <div class="effect-icon" id="effectIcon">💪</div>
        <h2 class="effect-title" id="effectTitle">Training</h2>
        <p class="effect-subtitle" id="effectSubtitle">✓ Hinzugefügt!</p>
    </div>
</div>

<!-- Particles Container -->
<div class="particles-container" id="particlesContainer"></div>
