<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Kickerscup - Football Manager</title>

    <!-- Preconnect für externe Ressourcen -->
    <link crossorigin href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Rajdhani:wght@600;700&display=swap"
          rel="stylesheet">

    <!-- Preload Background Images -->
    <link as="image" href="img/background-header.webp" media="(min-width: 769px)" rel="preload" type="image/webp">
    <link as="image" href="img/background-header-mobile.webp" media="(max-width: 768px)" rel="preload"
          type="image/webp">

    <!-- Core Layout CSS (immer geladen) -->
    <link href="css/layout.css" rel="stylesheet">

    <!--
        ⚡ PERFORMANCE: Scripts mit defer im <head>
        - Laden parallel zu HTML (schneller als <body>-Ende)
        - Ausführung garantiert nach DOM Ready
        - Reihenfolge garantiert (wichtig für Dependencies)
    -->

    <!-- Module Manager (MUSS zuerst geladen werden) -->
    <script defer src="javascript/module-manager.js"></script>

    <!-- Navigation System (benötigt ModuleManager) -->
    <script defer src="javascript/navigation.js"></script>

    <!--
        HINWEIS: Weitere Scripts (dashboard.js, team.js, etc.)
        werden dynamisch durch ModuleManager geladen
    -->
</head>
<body>
<!-- Fixed Background -->
<div class="hero-background">
    <picture>
        <source media="(max-width: 768px)" srcset="img/background-header-mobile.webp" type="image/webp">
        <source media="(min-width: 769px)" srcset="img/background-header.webp" type="image/webp">
        <img alt="Stadium Background" class="hero-bg-image" src="img/background-header.webp">
    </picture>
</div>

<!-- Animated Overlay -->
<div class="animated-bg-overlay"></div>

<!-- Top Status Bar -->
<div class="top-status-bar">
    <div class="status-left">
        <div class="compact-logo">KICKERSCUP</div>
        <div class="team-info-pill">
            <div class="team-logo-small">⚽</div>
            <span class="team-name-top">FC Thunderbolts</span>
        </div>
        <div class="date-time">
            <div class="current-date">Saison 2024/25 • Spieltag 12</div>
            <div class="current-time" id="currentTime">15:45 Uhr</div>
        </div>
    </div>

    <div class="status-right">
        <div class="budget-info">
            <div class="budget-icon">💰</div>
            <div class="budget-details">
                <div class="budget-label">Budget</div>
                <div class="budget-amount" id="budgetAmount">2.400.000 €</div>
            </div>
        </div>
        <div class="notification-icon" title="Benachrichtigungen">
            <span>🔔</span>
            <div class="notification-dot"></div>
        </div>
    </div>
</div>

<!-- Floating Navigation -->
<nav aria-label="Hauptnavigation" class="floating-nav" role="navigation">
    <div aria-label="Dashboard" class="nav-btn active" data-page="dashboard" role="button" tabindex="0">
        <div class="nav-btn-icon">🏠</div>
        <div class="nav-btn-label">Home</div>
    </div>
    <div aria-label="Team" class="nav-btn" data-page="team" role="button" tabindex="0">
        <div class="nav-btn-icon">👥</div>
        <div class="nav-btn-label">Team</div>
    </div>
    <div aria-label="Training" class="nav-btn" data-page="training" role="button" tabindex="0">
        <div class="nav-btn-icon">💪</div>
        <div class="nav-btn-label">Training</div>
    </div>
    <div aria-label="Taktik" class="nav-btn" data-page="tactics" role="button" tabindex="0">
        <div class="nav-btn-icon">📋</div>
        <div class="nav-btn-label">Taktik</div>
    </div>
    <div aria-label="Stadion" class="nav-btn" data-page="stadium" role="button" tabindex="0">
        <div class="nav-btn-icon">🏟️</div>
        <div class="nav-btn-label">Stadion</div>
    </div>
    <div aria-label="Liga" class="nav-btn" data-page="league" role="button" tabindex="0">
        <div class="nav-btn-icon">🏆</div>
        <div class="nav-btn-label">Liga</div>
        <div class="nav-badge">3</div>
    </div>
    <div aria-label="Pokal" class="nav-btn" data-page="cup" role="button" tabindex="0">
        <div class="nav-btn-icon">🥇</div>
        <div class="nav-btn-label">Pokal</div>
    </div>
    <div aria-label="Einstellungen" class="nav-btn" data-page="settings" role="button" tabindex="0">
        <div class="nav-btn-icon">⚙️</div>
        <div class="nav-btn-label">Settings</div>
    </div>
</nav>

<!-- Content Wrapper - wird dynamisch geladen -->
<main class="content-wrapper" id="contentWrapper" role="main">
    <!-- Content wird hier dynamisch vom NavigationSystem geladen -->
</main>
</body>
</html>
